name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Create Cordova project
        run: |
          test -s index.html
          test -s icon.png

         cordova create myapp com.mikheil.dosetracker4test "Dose Tracker 4 Test"

          cp index.html myapp/www/index.html
          cp icon.png myapp/www/icon.png

          mkdir -p myapp/res
          cp icon.png myapp/res/icon.png

      - name: Configure Android icons
        working-directory: myapp
        run: |
          node <<'NODE'
          const fs = require('fs');

          const densities = [
            'ldpi', 'mdpi', 'hdpi',
            'xhdpi', 'xxhdpi', 'xxxhdpi'
          ];

          fs.writeFileSync(
            'res/icon-background.xml',
            '<?xml version="1.0" encoding="utf-8"?>' +
            '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">' +
            '<solid android:color="#FFFFFF" />' +
            '</shape>'
          );

          const icons = densities.map(density =>
            `<icon density="${density}" ` +
            'src="res/icon.png" ' +
            'foreground="res/icon.png" ' +
            'background="res/icon-background.xml" />'
          ).join('\n');

          let xml = fs.readFileSync('config.xml', 'utf8');

          if (!xml.includes('</widget>')) {
            throw new Error('Closing widget tag not found');
          }

          xml = xml.replace(
            '</widget>',
            `<platform name="android">\n${icons}\n</platform>\n</widget>`
          );

          fs.writeFileSync('config.xml', xml);
          NODE

      - name: Add Android platform
        working-directory: myapp
        run: cordova platform add android@14.0.1

      - name: Build test APK
        working-directory: myapp
        run: cordova build android --debug -- --packageType=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dose-Tracker-4-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
