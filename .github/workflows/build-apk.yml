
name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        shell: bash
        run: |
          set -e
          cordova create myapp com.mikheil.dosetracker "DoseTracker4"
cp index.html myapp/www/index.html
mkdir -p myapp/res
cp "Radiation Dose Tracker Icon.png" myapp/res/icon.png
python3 -c 'from pathlib import Path; p=Path("myapp/config.xml"); s=p.read_text(); s=s.replace("</widget>", "    <icon src=\"res/icon.png\" />\n</widget>"); p.write_text(s)'

cd myapp
          cd myapp
          cordova platform add android
          cordova build android --release
          cd platforms/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        shell: bash
        run: |
          set -e
          cd myapp
          APK="platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"

          keytool -genkeypair -v \
            -keystore my-release-key.keystore \
            -alias alias_name \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass password \
            -keypass password \
            -dname "CN=Dose Tracker 4, O=Mikheil Jorbenadze, C=GE"

          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          "$ZIPALIGN" -f 4 "$APK" /tmp/Dose-Tracker-4-aligned.apk

          "$APKSIGNER" sign \
            --ks my-release-key.keystore \
            --ks-key-alias alias_name \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out /tmp/Dose-Tracker-4.apk \
            /tmp/Dose-Tracker-4-aligned.apk

          "$APKSIGNER" verify --verbose /tmp/Dose-Tracker-4.apk
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp /tmp/Dose-Tracker-4.apk "$GITHUB_WORKSPACE/output/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dose-Tracker-4-APK
          path: output/Dose-Tracker-4.apk
          if-no-files-found: error
