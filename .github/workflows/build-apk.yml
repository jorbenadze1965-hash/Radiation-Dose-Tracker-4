name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Cordova Project and Build
      run: |
        cordova create myapp com.mikheil.dosetracker "DoseTracker4"
        cp index.html myapp/www/index.html
        cd myapp
        
        # Включаем правильные настройки для Android
        cordova platform add android
        sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' platforms/android/app/src/main/AndroidManifest.xml
        
        # Собираем релизную версию (она ставится нормально)
        cordova build android --release -- --packageType=apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Dose-Tracker-4-APK
        path: myapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
