name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Cordova Project and Build
      run: |
        cordova create myapp com.mikheil.dosetracker "Dose Tracker 4"
        cp index.html myapp/www/index.html
        cd myapp
        
        # Устанавливаем иконку
        cp ../icon.png platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp ../icon.png platforms/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        cp ../icon.png platforms/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        cp ../icon.png platforms/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        cp ../icon.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        
        # Исправляем манифест
        sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' platforms/android/app/src/main/AndroidManifest.xml
        
        # Собираем и подписываем
        cordova build android --release
        keytool -genkey -v -keystore my-release-key.keystore -alias alias_name -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=My Name, OU=My Organization, O=My Company, L=My City, S=My State, C=US"
        jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore my-release-key.keystore platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk alias_name -storepass password -keypass password

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: Dose-Tracker-4-Signed-APK
        path: myapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
